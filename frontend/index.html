<!doctype html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart Collection</title>
    
    <!-- Tailwind & Fonts from Stitch -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700&family=Inter:wght@400;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "primary-fixed-dim": "#bec6e0",
                        "on-tertiary-fixed": "#271901",
                        "on-tertiary": "#ffffff",
                        "on-background": "#1b1b1d",
                        "surface-tint": "#565e74",
                        "status-pending": "#F59E0B",
                        "outline-variant": "#c6c6cd",
                        "surface-container-high": "#eae7e9",
                        "inverse-surface": "#303032",
                        "on-tertiary-fixed-variant": "#574425",
                        "surface-container-highest": "#e4e2e4",
                        "tertiary-container": "#271901",
                        "surface-container-low": "#f6f3f5",
                        "on-surface": "#1b1b1d",
                        "on-secondary-container": "#fefcff",
                        "on-primary-fixed-variant": "#3f465c",
                        "surface-dim": "#dcd9db",
                        "secondary": "#0051d5",
                        "error": "#ba1a1a",
                        "surface-container": "#f0edef",
                        "tertiary-fixed-dim": "#dec29a",
                        "primary": "#000000",
                        "outline": "#76777d",
                        "status-paid": "#10B981",
                        "inverse-primary": "#bec6e0",
                        "on-primary": "#ffffff",
                        "surface-bright": "#fcf8fa",
                        "on-tertiary-container": "#98805d",
                        "surface": "#fcf8fa",
                        "primary-fixed": "#dae2fd",
                        "on-secondary-fixed-variant": "#003ea8",
                        "on-surface-variant": "#45464d",
                        "background": "#fcf8fa",
                        "on-primary-fixed": "#131b2e",
                        "secondary-container": "#316bf3",
                        "on-error-container": "#93000a",
                        "on-primary-container": "#7c839b",
                        "error-container": "#ffdad6",
                        "surface-container-lowest": "#ffffff",
                        "status-overdue": "#DC2626",
                        "inverse-on-surface": "#f3f0f2",
                        "surface-variant": "#e4e2e4",
                        "secondary-fixed": "#dbe1ff",
                        "on-secondary": "#ffffff",
                        "secondary-fixed-dim": "#b4c5ff",
                        "merit-bounty": "#8B5CF6",
                        "on-error": "#ffffff",
                        "tertiary-fixed": "#fcdeb5",
                        "on-secondary-fixed": "#00174b",
                        "tertiary": "#000000",
                        "status-delayed": "#6366F1",
                        "primary-container": "#131b2e"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "margin-desktop": "32px",
                        "container-max": "1440px",
                        "unit": "4px",
                        "margin-mobile": "16px",
                        "gutter": "16px"
                    },
                    "fontFamily": {
                        "headline-lg": ["Hanken Grotesk"],
                        "headline-sm": ["Hanken Grotesk"],
                        "headline-md": ["Hanken Grotesk"],
                        "status-pill": ["Inter"],
                        "label-md": ["JetBrains Mono"],
                        "body-lg": ["Inter"],
                        "body-md": ["Inter"]
                    },
                    "fontSize": {
                        "headline-lg": ["30px", {"lineHeight": "36px", "fontWeight": "700"}],
                        "headline-sm": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                        "headline-md": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
                        "status-pill": ["11px", {"lineHeight": "12px", "fontWeight": "700"}],
                        "label-md": ["12px", {"lineHeight": "16px", "letterSpacing": "0.02em", "fontWeight": "500"}],
                        "body-lg": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                        "body-md": ["14px", {"lineHeight": "20px", "fontWeight": "400"}]
                    }
                }
            }
        }
    </script>
    <style>
        .material-symbols-outlined {
          font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined[data-weight="fill"] {
            font-variation-settings: 'FILL' 1;
        }
        body {
          min-height: max(884px, 100dvh);
        }
    </style>
  </head>
  <body class="bg-background text-on-background font-body-md text-body-md h-screen flex overflow-hidden">
    <div id="root" class="w-full h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
